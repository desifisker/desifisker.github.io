      - bullet: "**Aerospace Engineering Intern, Cesaroni Technology Inc. (2021-2022).** Contributed to large-scale testing facility CAD assemblies and test-system design; designed and implemented signal monitoring, data acquisition, and load-cell mounting methods for hazardous testing environments; used mathematical models and SolidWorks FEA to optimize retaining-ring and airframe components."
      - bullet: "**Aerospace Engineering Research Assistant, Royal Military College of Canada, Advanced Aircraft Design Lab (2020).** Integrated hardware and software for attitude and stabilization control on UAVs and UGVs; built MATLAB and Python tools for waypoint and obstacle assessment from magnetic-field data; conducted outdoor navigation testing and created startup documentation for autonomous guidance hardware."
